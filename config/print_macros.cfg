[gcode_macro PRINT_START]
description: Full print start sequence with LED status
gcode:
  {% set bed_temp      = params.BED_TEMP      | default(60)  | int %}
  {% set extruder_temp = params.EXTRUDER_TEMP | default(200) | int %}
  {% set chamber_temp  = params.CHAMBER_TEMP  | default(0)   | int %}

  CLEAR_PAUSE
  BED_MESH_CLEAR
  G90
  M83

  LED_HEATING
  M117 Heating bed...
  M140 S{bed_temp}

  {% if chamber_temp > 0 %}
    M117 Waiting for chamber...
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber_temp" MINIMUM={chamber_temp}
  {% endif %}

  M190 S{bed_temp}

  M117 Waiting for probe temp...
  TEMPERATURE_WAIT SENSOR="temperature_sensor cartographer_coil" MINIMUM=30

  M117 Homing...
  G28

  LED_MESHING
  M117 Leveling gantry...
  Z_TILT_ADJUST

  M117 Homing Z...
  G28 Z

  M117 Bed mesh...
  BED_MESH_CALIBRATE ADAPTIVE=1

  LED_HEATING
  M117 Heating nozzle...
  G0 X{printer.toolhead.axis_minimum.x + 5} Y{printer.toolhead.axis_minimum.y + 5} Z15 F9000
  M109 S{extruder_temp}

  M117 Purging...
  _PURGE_LINE

  LED_PRINTING
  M117 Printing...

[gcode_macro _PURGE_LINE]
description: Simple purge line at front left
gcode:
  {% set bed_x = printer.toolhead.axis_maximum.x %}
  G92 E0
  G0 X5 Y5 Z0.3 F9000
  G1 X{bed_x / 2} E15 F1500
  G1 Z2 F3000
  G92 E0

[gcode_macro PRINT_END]
description: Full print end sequence with LED status
gcode:
  SAVE_GCODE_STATE NAME=print_end_state
  M400
  G92 E0
  G1 E-5 F3600
  TURN_OFF_HEATERS
  {% set max_x = printer.toolhead.axis_maximum.x %}
  {% set max_y = printer.toolhead.axis_maximum.y %}
  {% set cur_z = printer.toolhead.position.z %}
  {% set z_safe = [cur_z + 20, printer.toolhead.axis_maximum.z] | min %}
  G0 Z{z_safe} F3600
  G0 X{max_x - 10} Y{max_y - 10} F9000
  M107
  M84
  LED_COMPLETE
  M117 Print complete!
  G4 P8000
  LED_COOLDOWN
  RESTORE_GCODE_STATE NAME=print_end_state

[gcode_macro CANCEL_PRINT]
description: Cancel print
rename_existing: BASE_CANCEL_PRINT
gcode:
  LED_ERROR
  TURN_OFF_HEATERS
  M107
  {% set cur_z  = printer.toolhead.position.z %}
  {% set z_safe = [cur_z + 20, printer.toolhead.axis_maximum.z] | min %}
  G0 Z{z_safe} F3600
  G0 X{printer.toolhead.axis_maximum.x - 10} Y{printer.toolhead.axis_maximum.y - 10} F9000
  M84
  BASE_CANCEL_PRINT
  G4 P5000
  LED_IDLE

[gcode_macro PAUSE]
description: Pause print
rename_existing: BASE_PAUSE
gcode:
  {% set z_safe = [printer.toolhead.position.z + 10, printer.toolhead.axis_maximum.z] | min %}
  SAVE_GCODE_STATE NAME=pause_state
  BASE_PAUSE
  G0 Z{z_safe} F3600
  G0 X{printer.toolhead.axis_minimum.x + 5} Y{printer.toolhead.axis_minimum.y + 5} F9000
  LED_HEATING
  M117 Paused

[gcode_macro RESUME]
description: Resume print
rename_existing: BASE_RESUME
gcode:
  LED_PRINTING
  RESTORE_GCODE_STATE NAME=pause_state MOVE=1 MOVE_SPEED=100
  BASE_RESUME
  M117 Printing...
