[gcode_macro _WLED_POST]
description: Post a colour directly to WLED via curl
gcode:
  {% set r   = params.R   | default(0)   | int %}
  {% set g   = params.G   | default(0)   | int %}
  {% set b   = params.B   | default(0)   | int %}
  {% set bri = params.BRI | default(255) | int %}
  {% set fx  = params.FX  | default(0)   | int %}
  {action_call_remote_method("set_wled_state",
                             strip="klipper",
                             state=True,
                             brightness=bri)}
  RUN_SHELL_COMMAND CMD=_wled_curl PARAMS="192.168.8.208 {r} {g} {b} {bri} {fx}"

[gcode_shell_command _wled_curl]
command: bash /home/pi/klipper_config/scripts/wled_colour.sh
timeout: 5
verbose: False

[gcode_macro LED_IDLE]
gcode:
  RUN_SHELL_COMMAND CMD=_wled_curl PARAMS="192.168.8.208 0 0 180 180 0"

[gcode_macro LED_HEATING]
gcode:
  RUN_SHELL_COMMAND CMD=_wled_curl PARAMS="192.168.8.208 80 255 0 220 0"

[gcode_macro LED_MESHING]
gcode:
  RUN_SHELL_COMMAND CMD=_wled_curl PARAMS="192.168.8.208 0 120 255 220 0"

[gcode_macro LED_PRINTING]
gcode:
  RUN_SHELL_COMMAND CMD=_wled_curl PARAMS="192.168.8.208 255 255 255 255 0"

[gcode_macro LED_COMPLETE]
gcode:
  RUN_SHELL_COMMAND CMD=_wled_curl PARAMS="192.168.8.208 255 50 0 255 1"

[gcode_macro LED_ERROR]
gcode:
  RUN_SHELL_COMMAND CMD=_wled_curl PARAMS="192.168.8.208 0 255 0 255 1"

[gcode_macro LED_COOLDOWN]
gcode:
  RUN_SHELL_COMMAND CMD=_wled_curl PARAMS="192.168.8.208 0 0 180 150 2"

[gcode_macro LED_OFF]
gcode:
  RUN_SHELL_COMMAND CMD=_wled_curl PARAMS="192.168.8.208 0 0 0 0 0"
